name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary_name: vimium-desktop
            asset_name: vimium-desktop-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: vimium-desktop.exe
            asset_name: vimium-desktop-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libdbus-1-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Executable (Release)
        run: cargo build --release --target ${{ matrix.target }} --verbose

      - name: Package Windows assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination "dist/${{ matrix.asset_name }}"
          Compress-Archive -Path "dist/${{ matrix.asset_name }}" -DestinationPath "dist/vimium-desktop-windows-x86_64.zip"

      - name: Package Linux assets
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/${{ matrix.asset_name }}"
          chmod +x "dist/${{ matrix.asset_name }}"
          tar -czf "dist/vimium-desktop-linux-x86_64.tar.gz" -C dist "${{ matrix.asset_name }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-assets-*
          merge-multiple: true

      - name: Generate Checksums and Notes
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          echo "Automated release of **Vimium Desktop** for Windows and Linux (x86_64)." > ../notes.txt
          echo "" >> ../notes.txt
          echo "### Checksums (SHA-256)" >> ../notes.txt
          echo '```' >> ../notes.txt
          cat SHA256SUMS.txt >> ../notes.txt
          echo '```' >> ../notes.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: "Vimium Desktop ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          body_path: notes.txt
          files: dist/*
          draft: false
          prerelease: false
